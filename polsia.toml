
runtime = "node"
start = "npm start"
build = "npm install --include=dev && npm run build --if-present"
port_env_var = "PORT"
healthcheck_path = "/api/health"

[env]
DATABASE_URL = { source = "rdbms" }

[[crons]]
name = "podcast-youtube-sync"
schedule = "0 9 * * 1"
command = "node jobs/podcast-youtube-sync.js"
